<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Космическое приключение Робота Знайки</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 15px; }
    h1 { text-align: center; font-size: 20px; color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
    .chat { max-width: 600px; margin: 0 auto; background: #16213e; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 80vh; border: 2px solid #0f3460; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; }
    .msg { max-width: 85%; padding: 12px 16px; margin: 10px 0; border-radius: 15px; line-height: 1.5; font-size: 15px; }
    .bot { background: #0f3460; color: #e0e0e0; border-bottom-left-radius: 2px; border-left: 3px solid #00d2ff; }
    .user { background: #e94560; color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
    .options { padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #0f3460; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;}
    .options button { padding: 12px; border: none; background: #00d2ff; color: #1a1a2e; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
    .options button:hover { background: #fff; transform: scale(1.02); }
  </style>
</head>
<body>
  <h1>Миссия: Спасти корабль!</h1>
  <div class="chat">
    <div id="messages" class="messages"></div>
    <div id="options" class="options"></div>
  </div>

  <script>
    const storySteps = [
      {
        q: "Привет, землянин! Я — Робот Знайка. Космический пират разобрал мой корабль на части! Чтобы собрать его, мне нужны детали, а они заколдованы. Поможешь мне? (Нажми кнопку ниже)",
        options: ["Да, я помогу!"],
        next: 1
      },
      {
        q: "Отлично! Первая деталь — это КОРЕНЬ. Чтобы получить её, найди общую часть (корень) в словах: ЛЕС, ЛЕСНОЙ, ЛЕСНИК.",
        options: ["-лес-", "-ной-", "-ник-"],
        correct: 0,
        explain: "Верно! Корень -лес-. Первая деталь получена!",
        next: 2
      },
      {
        q: "Ура! Двигатель почти готов. Теперь нужна ПРИСТАВКА. Найди приставку в слове ПЕРЕХОД.",
        options: ["-ход-", "пере-", "-переход-"],
        correct: 1,
        explain: "Супер! Приставка пере-. Двигатель установлен!",
        next: 3
      },
      {
        q: "Осталось последнее задание. Найди СУФФИКС в слове ДОМИК, чтобы запустить бортовой компьютер.",
        options: ["дом-", "-ик", "-к"],
        correct: 1,
        explain: "Молодец! Суффикс -ик. Компьютер включен!",
        next: 4
      },
      {
        q: "Спасибо тебе огромное! Ты отлично знаешь состав слова! Теперь я могу лететь на планету Слов. Хочешь пройти приключение заново?",
        options: ["Начать сначала"],
        next: 0
      }
    ];

    let currentStep = 0;
    const messages = document.getElementById("messages");
    const optionsDiv = document.getElementById("options");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showStep() {
      const step = storySteps[currentStep];
      addMessage(step.q, "bot");
      
      optionsDiv.innerHTML = "";
      step.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.textContent = option;
        btn.onclick = () => handleAnswer(index, step);
        optionsDiv.appendChild(btn);
      });
    }

    function handleAnswer(index, step) {
      addMessage(step.options[index], "user");
      optionsDiv.innerHTML = "";

      if (step.correct !== undefined) {
        if (index === step.correct) {
          addMessage(step.explain, "bot");
          currentStep = step.next;
          setTimeout(showStep, 1000);
        } else {
          addMessage("Ой, ошибка. Попробуй еще раз!", "bot");
          setTimeout(showStep, 1000);
        }
      } else {
        currentStep = step.next;
        setTimeout(showStep, 500);
      }
    }

    showStep();
  </script>
</body>
</html>
